services:
  siet-portal:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: siet-portal
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./docker/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/siet/ssl:/etc/nginx/ssl:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "--quiet", "--tries=1", "--spider", "https://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
