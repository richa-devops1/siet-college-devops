name: S.I.E.T. CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  validate-scripts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Bash script syntax
        run: |
          bash -n scripts/deploy.sh
          bash -n scripts/server-health.sh
          bash -n scripts/website-health.sh
          bash -n scripts/full-health-check.sh
          bash -n scripts/test-website.sh

      - name: Validate completed
        run: echo "S.I.E.T. Bash script validation passed."

      - name: Validate Docker image build
        run: docker build -f docker/Dockerfile -t siet-portal:test .

      - name: Test S.I.E.T. website content
        run: |
          grep -q "S.I.E.T." app/index.html
          echo "S.I.E.T. website content test passed."
      - name: Test website HTTP response
        run: |
          docker run -d --name siet-ci-test -p 8080:80 siet-portal:test
          trap 'docker rm -f siet-ci-test >/dev/null 2>&1 || true' EXIT

          for i in {1..10}; do
            if curl -fsS http://localhost:8080/ -o /tmp/siet-test.html; then
              break
            fi
            sleep 2
          done

          grep -q "S.I.E.T." /tmp/siet-test.html
          echo "S.I.E.T. HTTP website test passed."

  deploy-to-centos:
    needs: validate-scripts
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy S.I.E.T. website
        run: docker compose up -d --build

      - name: Verify website deployment
        run: |
          for i in {1..10}; do
            if curl -fsS http://localhost:8080/ -o /tmp/siet-deploy.html; then
              break
            fi
            sleep 3
          done
          grep -q "S.I.E.T." /tmp/siet-deploy.html
          echo "S.I.E.T. deployment successful."
